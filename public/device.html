<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Connecting &mdash; BB10 / PlayBook App Manager</title>
  <link rel="icon" href="images/playbook.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main class="shell narrow">
    <section class="card connect-card">
      <div class="logo-wrap small">
        <img class="logo" src="images/playbook.png" alt="">
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <h2 id="status">Connecting to device&hellip;</h2>
      <p id="detail" class="hint"></p>
      <a class="back-link" href="index.html">&larr; Back to devices</a>
    </section>
  </main>
  <script>
    (function () {
      var host = (new URLSearchParams(location.search).get('host') || '').trim()
      window.DEVICE_HOST = host

      var status = document.getElementById('status')
      var detail = document.getElementById('detail')

      if (!host) {
        status.textContent = 'No device selected'
        detail.textContent = 'Open a device from the device list.'
        return
      }

      detail.textContent = host + ' \u2014 logging in and loading installed apps\u2026'

      var script = document.createElement('script')
      script.src = 'pb-apps.js'
      script.onerror = function () {
        status.textContent = 'Could not load pb-apps.js'
        detail.textContent = 'Make sure the local server is still running.'
      }
      document.body.appendChild(script)
    })()
  </script>
</body>

</html>
